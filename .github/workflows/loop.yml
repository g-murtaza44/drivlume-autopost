name: Post loop
# Self-chaining runner: waits for the next slot, posts, then starts itself again.
# GitHub's own cron is unreliable, so the cron below is only a backup to restart the chain.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"
permissions:
  contents: write
  actions: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Stop if another loop is already running
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/loop.yml/runs?status=in_progress" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          echo "others=$n" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.guard.outputs.others == '0'
      - name: Wait for next slot
        if: steps.guard.outputs.others == '0'
        run: python scripts/wait.py
      - name: Post if due
        if: steps.guard.outputs.others == '0'
        run: |
          git pull -q --rebase
          python scripts/post.py ""
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Save log
        if: steps.guard.outputs.others == '0'
        run: |
          git config user.name "Drivlume Bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted.log 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%F_%H%M)" && git pull --rebase -q && git push)
      - name: Start next loop
        if: always() && steps.guard.outputs.others == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run loop.yml --repo ${{ github.repository }} --ref main
